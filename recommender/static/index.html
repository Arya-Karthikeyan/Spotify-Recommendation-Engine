<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate Digger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
:root {
  --bg: #f3f4f8;
  --panel: #ffffff;
  --text: #161a2b;
  --muted: #5d6378;
  --border: #dde0ea;
  --accent: #4338ca;
  --accent-light: #e6e5fb;
  --red: #b42318;
  --red-light: #fbe7e5;
  --bar: #c9cde0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1119; --panel: #171a26; --text: #e9eaf3; --muted: #9a9fb6; --border: #2a2e40;
    --accent: #a5a1ff; --accent-light: #26244a; --red: #ff8a7a; --red-light: #3a1d1c; --bar: #343850;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 48px;
  background: var(--bg); color: var(--text);
  font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
}
button, input { font: inherit; color: inherit; }
.container { max-width: 1180px; margin: 0 auto; }
h1 { font: 800 38px/1 "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 6px; }
h1 span { color: var(--accent); }
.subtitle { color: var(--muted); margin: 0 0 24px; }
.mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }

.layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

.sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; position: sticky; top: 16px; }
@media (max-width: 820px) { .sidebar { position: static; } }
.sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.sidebar > h3:first-child { margin-top: 0; }
#settings { margin-top: 18px; }

.search { position: relative; }
.search input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
#dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .2); z-index: 5; max-height: 320px; overflow: auto; }
.option { display: flex; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.option.active, .option:hover { background: var(--accent-light); }
.option div { flex: 1; min-width: 0; }
.option small { color: var(--muted); }
.option .avoid { color: var(--red); background: none; border: 0; font-size: 12px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--accent-light); font-size: 13px; max-width: 100%; }
.chip.dislike { background: var(--red-light); }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); }

.slider { display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
.slider input { width: 100%; accent-color: var(--accent); }
.slider small { width: 100%; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

.genre { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 3px 12px; margin: 0 4px 6px 0; cursor: pointer; font-size: 13px; }
.genre.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
label.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }

.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
.results-header h2 { margin: 0; font-size: 20px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn.red { color: var(--red); }

.card { display: grid; grid-template-columns: 32px 1fr auto; gap: 14px; padding: 14px 16px; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.card .num { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 13px; }
.card .info { min-width: 0; }
.card .title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.card .title span { color: var(--muted); font-weight: 400; }
.card .why { font-size: 13px; margin: 4px 0 8px; }
.card .buttons { display: flex; flex-direction: column; gap: 6px; }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 420px; font-size: 11px; color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--bar); }
.bar div { height: 100%; border-radius: 2px; background: var(--accent); }
@media (max-width: 520px) {
  .card { grid-template-columns: 24px 1fr; }
  .card .buttons { grid-column: 2; flex-direction: row; flex-wrap: wrap; }
  .bars { grid-template-columns: repeat(2, 1fr); }
}
.message { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Crate <span>Digger</span></h1>
  <p class="subtitle">Pick some songs you like and it finds similar ones, based on how they sound and what playlists they're in.
    <br><span class="mono">~25k songs, released up to Jan 2020</span></p>

  <div class="layout">
    <div class="sidebar">
      <h3>Songs you like</h3>
      <div class="search">
        <input id="search" type="search" placeholder="Search a song or &quot;title - artist&quot;" autocomplete="off">
        <div id="dropdown" style="display:none"></div>
      </div>
      <div class="chips" id="seeds"></div>

      <div id="dislikes-section" style="display:none">
        <h3>Avoiding</h3>
        <div class="chips" id="dislikes"></div>
      </div>

      <details id="settings" open>
        <summary><h3 style="display:inline">Settings</h3></summary>
        <div style="margin-top:12px">
          <div class="slider">
            <label for="diversity">Variety</label><span id="diversity-val"></span>
            <input id="diversity" type="range" min="0" max="1" step="0.05" value="0.3">
            <small><span>close matches</span><span>more varied</span></small>
          </div>
          <div class="slider">
            <label for="collab">Playlist patterns</label><span id="collab-val"></span>
            <input id="collab" type="range" min="0" max="1" step="0.05" value="0.4">
            <small><span>sound only</span><span>playlists only</span></small>
          </div>
          <div class="slider">
            <label for="popularity">Popularity boost</label><span id="popularity-val"></span>
            <input id="popularity" type="range" min="0" max="1" step="0.05" value="0.1">
            <small><span>deep cuts</span><span>hits</span></small>
          </div>
          <div class="slider">
            <label for="n">How many</label><span id="n-val"></span>
            <input id="n" type="range" min="5" max="50" step="5" value="20">
          </div>
          <h3>Genres</h3>
          <div id="genres"></div>
          <label class="check"><input type="checkbox" id="new-artists"> Only new artists</label>
        </div>
      </details>
    </div>

    <div>
      <div class="results-header">
        <h2 id="results-title">Recommendations</h2>
        <button class="btn" id="copy">Copy Spotify links</button>
      </div>
      <div id="results"><div class="message">Loading...</div></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const GENRES = ["edm", "latin", "pop", "r&b", "rap", "rock"];
const EXAMPLE_SEEDS = ["Smells Like Teen Spirit - Nirvana", "Basket Case - Green Day"];

let seeds = [];
let dislikes = [];
let selectedGenres = [];
let results = [];
let usingExample = false;

const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function showToast(text) {
  $("toast").textContent = text;
  $("toast").style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => $("toast").style.display = "none", 1800);
}

function saveSeeds() {
  try { localStorage.setItem("seeds", JSON.stringify({seeds, dislikes})); } catch (e) {}
}

function loadSeeds() {
  try {
    const saved = JSON.parse(localStorage.getItem("seeds"));
    if (saved && saved.seeds.length) {
      seeds = saved.seeds;
      dislikes = saved.dislikes || [];
      return true;
    }
  } catch (e) {}
  return false;
}

// ---- seed chips ----

function drawChips() {
  const chip = (song, type) =>
    `<span class="chip ${type}">${escapeHtml(song.name)} · ${escapeHtml(song.artist)}
      <button onclick="removeSong('${type}', '${song.id}')" title="remove">✕</button></span>`;
  $("seeds").innerHTML = seeds.map(s => chip(s, "seed")).join("");
  $("dislikes").innerHTML = dislikes.map(s => chip(s, "dislike")).join("");
  $("dislikes-section").style.display = dislikes.length ? "block" : "none";
  $("results-title").textContent = usingExample ? "Recommendations (example)" : "Recommendations";
}

function removeSong(type, id) {
  if (type === "seed") seeds = seeds.filter(s => s.id !== id);
  else dislikes = dislikes.filter(s => s.id !== id);
  update();
}

function addSeed(song) {
  if (usingExample) { seeds = []; usingExample = false; }
  dislikes = dislikes.filter(s => s.id !== song.id);
  if (!seeds.some(s => s.id === song.id)) seeds.push(song);
  update();
}

function addDislike(song) {
  seeds = seeds.filter(s => s.id !== song.id);
  if (!dislikes.some(s => s.id === song.id)) dislikes.push(song);
  update();
}

function update() {
  saveSeeds();
  drawChips();
  getRecommendations();
}

// ---- search box ----

let searchResults = [];
let activeIndex = 0;
let searchTimer;

$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("search").value.trim();
  if (q.length < 2) { $("dropdown").style.display = "none"; return; }
  // wait a bit so we don't search on every key press
  searchTimer = setTimeout(async () => {
    const res = await fetch("/api/search?q=" + encodeURIComponent(q));
    searchResults = await res.json();
    activeIndex = 0;
    drawDropdown();
  }, 150);
});

function drawDropdown() {
  const dd = $("dropdown");
  if (!searchResults.length) {
    dd.innerHTML = `<div class="option"><small>No match. The dataset only has songs up to Jan 2020.</small></div>`;
  } else {
    dd.innerHTML = searchResults.map((s, i) => `
      <div class="option ${i === activeIndex ? "active" : ""}" data-i="${i}">
        <div><b>${escapeHtml(s.name)}</b><br><small>${escapeHtml(s.artist)} · ${s.year}</small></div>
        <button class="avoid" data-avoid="${i}">avoid</button>
      </div>`).join("");
  }
  dd.style.display = "block";
}

$("search").addEventListener("keydown", e => {
  if ($("dropdown").style.display === "none") return;
  if (e.key === "ArrowDown") activeIndex = Math.min(activeIndex + 1, searchResults.length - 1);
  else if (e.key === "ArrowUp") activeIndex = Math.max(activeIndex - 1, 0);
  else if (e.key === "Enter" && searchResults[activeIndex]) { chooseResult(searchResults[activeIndex]); return; }
  else if (e.key === "Escape") { $("dropdown").style.display = "none"; return; }
  else return;
  e.preventDefault();
  drawDropdown();
});

$("dropdown").addEventListener("mousedown", e => {
  e.preventDefault();  // stops the input losing focus before the click registers
  const avoidBtn = e.target.closest("[data-avoid]");
  if (avoidBtn) {
    addDislike(searchResults[avoidBtn.dataset.avoid]);
    $("search").value = "";
    $("dropdown").style.display = "none";
    return;
  }
  const option = e.target.closest("[data-i]");
  if (option) chooseResult(searchResults[option.dataset.i]);
});

$("search").addEventListener("blur", () => setTimeout(() => $("dropdown").style.display = "none", 100));

function chooseResult(song) {
  addSeed(song);
  $("search").value = "";
  $("dropdown").style.display = "none";
}

// ---- settings ----

for (const id of ["diversity", "collab", "popularity", "n"]) {
  const showValue = () => $(id + "-val").textContent = id === "n" ? $(id).value : Math.round($(id).value * 100) + "%";
  showValue();
  $(id).addEventListener("input", showValue);
  $(id).addEventListener("change", getRecommendations);
}

$("genres").innerHTML = GENRES.map(g => `<button class="genre" data-genre="${g}">${g}</button>`).join("");
$("genres").addEventListener("click", e => {
  const btn = e.target.closest("[data-genre]");
  if (!btn) return;
  btn.classList.toggle("on");
  selectedGenres = [...document.querySelectorAll(".genre.on")].map(b => b.dataset.genre);
  getRecommendations();
});

$("new-artists").addEventListener("change", getRecommendations);

// ---- recommendations ----

let requestCount = 0;

async function getRecommendations() {
  if (!seeds.length) {
    results = [];
    $("results").innerHTML = `<div class="message">Search for a song you like to get started.</div>`;
    return;
  }
  const thisRequest = ++requestCount;
  $("results").style.opacity = 0.5;
  try {
    const res = await fetch("/api/recommend", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        seeds: seeds.map(s => s.id),
        dislikes: dislikes.map(s => s.id),
        n: Number($("n").value),
        diversity: Number($("diversity").value),
        collab: Number($("collab").value),
        popularity: Number($("popularity").value),
        new_artists: $("new-artists").checked,
        genres: selectedGenres,
      }),
    });
    if (!res.ok) throw new Error("server returned " + res.status);
    const data = await res.json();
    if (thisRequest !== requestCount) return;  // a newer request already started
    results = data;
    drawResults();
  } catch (err) {
    $("results").innerHTML = `<div class="message">Something went wrong: ${escapeHtml(err.message)}</div>`;
  }
  $("results").style.opacity = 1;
}

function bar(label, value) {
  return `<div>${label}<div class="bar"><div style="width:${Math.round(value * 100)}%"></div></div></div>`;
}

function drawResults() {
  if (!results.length) {
    $("results").innerHTML = `<div class="message">No songs match those filters, try turning some off.</div>`;
    return;
  }
  $("results").innerHTML = results.map((s, i) => `
    <div class="card">
      <div class="num">${String(i + 1).padStart(2, "0")}</div>
      <div class="info">
        <div class="title">${escapeHtml(s.name)} <span>- ${escapeHtml(s.artist)}</span></div>
        <div class="mono">${s.year} &nbsp; ${s.tempo} BPM &nbsp; ${s.genres.join(" / ")} &nbsp; sound match ${Math.round(s.match * 100)}%</div>
        ${s.reasons.length ? `<p class="why">${s.reasons.map(escapeHtml).join(" · ")}</p>` : ""}
        <div class="bars">${bar("energy", s.energy)}${bar("dance", s.danceability)}${bar("mood", s.valence)}${bar("acoustic", s.acousticness)}</div>
      </div>
      <div class="buttons">
        <button class="btn" data-more="${i}">More like this</button>
        <button class="btn red" data-no="${i}">Not for me</button>
        <a class="btn" href="https://open.spotify.com/track/${s.id}" target="_blank">Open ↗</a>
      </div>
    </div>`).join("");
}

$("results").addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  const no = e.target.closest("[data-no]");
  if (more) { addSeed(results[more.dataset.more]); showToast("Added to your songs"); }
  if (no) { addDislike(results[no.dataset.no]); showToast("Got it, avoiding that"); }
});

$("copy").addEventListener("click", async () => {
  const links = results.map(s => "https://open.spotify.com/track/" + s.id).join("\n");
  try {
    await navigator.clipboard.writeText(links);
    showToast("Copied " + results.length + " links, paste them into a Spotify playlist");
  } catch (e) {
    showToast("Couldn't copy, your browser blocked it");
  }
});

// ---- start ----

async function start() {
  // hide the settings by default on phones so you can see the results
  if (window.innerWidth <= 820) $("settings").open = false;

  if (!loadSeeds()) {
    usingExample = true;
    for (const q of EXAMPLE_SEEDS) {
      const found = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
      if (found.length) seeds.push(found[0]);
    }
  }
  drawChips();
  getRecommendations();
}

start();
</script>
</body>
</html>
